<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#13322B">
<title>Dr Janson's Veterinary Hospital — Premium Website Concept</title>
<meta name="description" content="A premium editorial website concept for Dr Janson's Veterinary Hospital in Johannesburg South.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#13322B;
  --ink-2:#1C4239;
  --teal:#57AA8D;
  --teal-bright:#0FBF96;
  --mint:#D9EEE7;
  --cream:#FBF8F2;
  --paper:#FFFDF9;
  --line:rgba(19,50,43,.13);
  --muted:#6F7B76;
  --shadow:0 26px 80px rgba(19,50,43,.12);
  --radius:28px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;background:var(--cream)}
body{margin:0;color:var(--ink);background:var(--cream);font-family:"DM Sans",Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit}
img{display:block;max-width:100%}
::selection{background:var(--teal);color:white}
.wrap{width:min(1240px,calc(100% - 40px));margin:auto}
.serif{font-family:"Playfair Display",Georgia,serif}
.eyebrow{font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;font-weight:700}
.topline{height:36px;background:var(--ink);color:#e9f4f0;display:flex;align-items:center;font-size:.69rem;letter-spacing:.04em}
.topline .wrap{display:flex;justify-content:space-between;align-items:center;gap:20px}
.topline span{opacity:.82}
.nav{position:sticky;top:0;z-index:50;background:rgba(251,248,242,.92);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.nav-in{height:88px;display:flex;align-items:center;justify-content:space-between;gap:24px}
.brand{display:flex;align-items:center;gap:12px;min-width:260px}
.logo{width:58px;height:58px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 1px rgba(19,50,43,.08);background:white}
.brand-copy strong{display:block;font-family:"Playfair Display",Georgia,serif;font-size:1.07rem;line-height:1.05;letter-spacing:.01em}
.brand-copy small{display:block;margin-top:4px;font-size:.58rem;letter-spacing:.14em;text-transform:uppercase;color:var(--teal)}
.nav-links{display:flex;align-items:center;gap:28px;font-size:.82rem;font-weight:600}
.nav-links a{position:relative;padding:6px 0}
.nav-links a:after{content:"";position:absolute;left:0;right:100%;bottom:0;height:1px;background:var(--ink);transition:.3s}
.nav-links a:hover:after{right:0}
.nav-actions{display:flex;gap:9px;align-items:center}
.btn{min-height:48px;border-radius:999px;padding:0 20px;display:inline-flex;align-items:center;justify-content:center;gap:9px;font-size:.79rem;font-weight:700;border:1px solid transparent;transition:.25s;cursor:pointer}
.btn:hover{transform:translateY(-2px)}
.btn-dark{background:var(--ink);color:white;box-shadow:0 12px 30px rgba(19,50,43,.15)}
.btn-dark:hover{background:var(--ink-2)}
.btn-light{border-color:var(--line);background:rgba(255,255,255,.7)}
.menu{display:none;width:46px;height:46px;border:1px solid var(--line);background:white;border-radius:50%;align-items:center;justify-content:center}
.hero{min-height:760px;display:grid;align-items:center;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 13% 18%,rgba(87,170,141,.16),transparent 28%),radial-gradient(circle at 83% 28%,rgba(15,191,150,.08),transparent 26%);pointer-events:none}
.hero-grid{display:grid;grid-template-columns:1.02fr .98fr;gap:52px;align-items:center;padding:72px 0 82px;position:relative;z-index:2}
.hero-copy{position:relative}
.hero-tag{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--line);padding:9px 13px;border-radius:999px;background:rgba(255,255,255,.52);font-size:.68rem;text-transform:uppercase;letter-spacing:.14em;font-weight:700}
.hero-tag i{width:7px;height:7px;background:var(--teal-bright);border-radius:50%;box-shadow:0 0 0 5px rgba(15,191,150,.11)}
.hero h1{font-family:"Playfair Display",Georgia,serif;font-size:clamp(4.25rem,7vw,7.45rem);line-height:.84;letter-spacing:-.055em;font-weight:500;margin:28px 0 25px;max-width:800px}
.hero h1 em{font-weight:500;color:var(--teal);font-style:italic}
.hero-lead{font-size:1.03rem;line-height:1.7;color:#50615b;max-width:590px}
.hero-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}
.hero-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:48px;max-width:650px}
.meta-item{padding-top:15px;border-top:1px solid var(--line)}
.meta-item strong{display:block;font-family:"Playfair Display",Georgia,serif;font-size:1.25rem;font-weight:500}
.meta-item span{display:block;margin-top:5px;color:var(--muted);font-size:.68rem;line-height:1.45}
.hero-visual{position:relative;min-height:610px}
.photo-card{position:absolute;inset:0 0 50px 25px;border-radius:44px;overflow:hidden;box-shadow:var(--shadow);background:#d9e7e0}
.photo-card img{width:100%;height:100%;object-fit:cover;object-position:center}
.photo-card:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 62%,rgba(19,50,43,.38))}
.photo-note{position:absolute;left:28px;bottom:28px;z-index:2;color:white}
.photo-note small{display:block;text-transform:uppercase;letter-spacing:.16em;font-size:.58rem;opacity:.72}
.photo-note strong{font-family:"Playfair Display",Georgia,serif;font-size:1.1rem;font-weight:500}
.orbit{position:absolute;width:152px;height:152px;border:1px solid rgba(19,50,43,.17);border-radius:50%;right:-28px;top:-30px;display:grid;place-items:center;animation:spin 18s linear infinite}
.orbit:before{content:"CARE • TRUST • CLARITY • COMMUNITY •";font-size:.56rem;letter-spacing:.17em;color:var(--ink);width:112px;text-align:center;line-height:1.8}
@keyframes spin{to{transform:rotate(360deg)}}
.mini-card{position:absolute;left:-18px;bottom:0;width:230px;padding:20px;background:var(--ink);color:white;border-radius:22px;box-shadow:0 20px 55px rgba(19,50,43,.22)}
.mini-card .n{font-family:"Playfair Display",Georgia,serif;font-size:2.4rem;color:var(--teal-bright);line-height:1}
.mini-card p{font-size:.72rem;line-height:1.5;color:rgba(255,255,255,.72);margin:9px 0 0}
.marquee{overflow:hidden;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--paper)}
.track{display:flex;width:max-content;animation:marquee 28s linear infinite}
.track span{padding:18px 34px;font-family:"Playfair Display",Georgia,serif;font-size:1.05rem;white-space:nowrap}
.track b{color:var(--teal);font-weight:500}
@keyframes marquee{to{transform:translateX(-50%)}}
.section{padding:112px 0}
.section-head{display:grid;grid-template-columns:.75fr 1.25fr;gap:40px;align-items:start;margin-bottom:52px}
.section-head h2{font-family:"Playfair Display",Georgia,serif;font-size:clamp(3.1rem,5.5vw,5.4rem);line-height:.92;letter-spacing:-.045em;font-weight:500;margin:0}
.section-head p{font-size:.96rem;line-height:1.75;color:var(--muted);max-width:620px;margin:11px 0 0}
.about-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:24px;align-items:stretch}
.about-panel{background:var(--ink);color:white;border-radius:36px;padding:54px;position:relative;overflow:hidden;min-height:520px}
.about-panel:before{content:"J";position:absolute;right:-12px;bottom:-90px;font-family:"Playfair Display",Georgia,serif;font-size:26rem;line-height:1;color:rgba(255,255,255,.035)}
.about-panel h3{font-family:"Playfair Display",Georgia,serif;font-size:3rem;line-height:1.02;font-weight:500;margin:22px 0}
.about-panel p{color:rgba(255,255,255,.7);line-height:1.75;font-size:.9rem;max-width:580px}
.about-points{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:38px}
.point{padding:15px 0;border-top:1px solid rgba(255,255,255,.15)}
.point strong{display:block;font-size:.77rem}
.point span{display:block;font-size:.66rem;line-height:1.45;color:rgba(255,255,255,.54);margin-top:5px}
.pets-panel{border-radius:36px;overflow:hidden;position:relative;background:#dfe9e4;min-height:520px}
.pets-panel img{width:100%;height:100%;object-fit:cover}
.pets-panel .caption{position:absolute;left:24px;right:24px;bottom:24px;background:rgba(251,248,242,.91);backdrop-filter:blur(12px);padding:17px 18px;border-radius:18px;font-size:.71rem;color:#52625c;line-height:1.5}
.services{background:var(--paper)}
.service-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
.service-card{border:1px solid var(--line);background:var(--cream);border-radius:26px;padding:28px;min-height:270px;display:flex;flex-direction:column;justify-content:space-between;transition:.3s;overflow:hidden;position:relative}
.service-card:hover{transform:translateY(-6px);box-shadow:0 24px 65px rgba(19,50,43,.09);background:white}
.service-card:nth-child(1){grid-column:span 5}
.service-card:nth-child(2){grid-column:span 3}
.service-card:nth-child(3){grid-column:span 4;background:var(--mint)}
.service-card:nth-child(4){grid-column:span 4}
.service-card:nth-child(5){grid-column:span 4;background:var(--ink);color:white}
.service-card:nth-child(6){grid-column:span 4}
.service-num{font-family:"Playfair Display",Georgia,serif;font-size:.9rem;color:var(--teal)}
.service-card h3{font-family:"Playfair Display",Georgia,serif;font-size:2.15rem;line-height:1.02;font-weight:500;margin:34px 0 10px}
.service-card p{font-size:.75rem;line-height:1.6;color:var(--muted);margin:0;max-width:360px}
.service-card.dark p{color:rgba(255,255,255,.62)}
.service-icon{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:1rem}
.service-card.dark .service-icon{border-color:rgba(255,255,255,.18)}
.concept-note{font-size:.68rem;color:var(--muted);margin-top:18px}
.conversion{padding:96px 0;background:var(--ink);color:white;position:relative;overflow:hidden}
.conversion:after{content:"BOOK";position:absolute;right:-25px;bottom:-90px;font-family:"Playfair Display",Georgia,serif;font-size:18rem;color:rgba(255,255,255,.025);line-height:1}
.conversion-grid{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center;position:relative;z-index:2}
.conversion h2{font-family:"Playfair Display",Georgia,serif;font-size:clamp(3.2rem,5.2vw,5.7rem);font-weight:500;line-height:.91;letter-spacing:-.045em;margin:0}
.conversion h2 em{color:var(--teal-bright);font-style:italic;font-weight:500}
.conversion p{color:rgba(255,255,255,.68);font-size:.9rem;line-height:1.75;max-width:540px}
.conversion-card{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);padding:30px;border-radius:28px}
.flow{display:grid;gap:10px}
.flow-row{display:flex;align-items:center;justify-content:space-between;gap:14px;border-bottom:1px solid rgba(255,255,255,.1);padding:13px 0}
.flow-row:last-child{border-bottom:0}
.flow-row span{font-size:.72rem;color:rgba(255,255,255,.68)}
.flow-row b{font-family:"Playfair Display",Georgia,serif;font-size:1.15rem;font-weight:500}
.live-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.live-actions .btn{min-height:54px}
.btn-mint{background:var(--teal-bright);color:#062a20}
.btn-outline-white{border-color:rgba(255,255,255,.22);color:white;background:transparent}
.journal{background:linear-gradient(180deg,var(--cream),#f4eee4)}
.journal-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}
.journal-feature{background:var(--paper);border:1px solid var(--line);border-radius:34px;padding:46px;min-height:480px;display:flex;flex-direction:column;justify-content:space-between}
.journal-feature .big{font-family:"Playfair Display",Georgia,serif;font-size:4.15rem;line-height:.9;font-weight:500;letter-spacing:-.045em;max-width:690px}
.journal-feature .big em{color:var(--teal);font-style:italic;font-weight:500}
.journal-feature p{color:var(--muted);line-height:1.7;font-size:.84rem;max-width:620px}
.journal-side{display:grid;gap:18px}
.small-story{border-radius:30px;border:1px solid var(--line);padding:30px;background:var(--mint);min-height:230px;display:flex;flex-direction:column;justify-content:space-between}
.small-story:nth-child(2){background:var(--ink);color:white}
.small-story h3{font-family:"Playfair Display",Georgia,serif;font-size:2rem;line-height:1.03;font-weight:500;margin:0}
.small-story p{font-size:.72rem;line-height:1.55;color:var(--muted);margin:10px 0 0}
.small-story:nth-child(2) p{color:rgba(255,255,255,.58)}
.location-grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:18px}
.location-card{background:var(--paper);border:1px solid var(--line);border-radius:34px;padding:46px;min-height:480px;display:flex;flex-direction:column;justify-content:space-between}
.location-card h2{font-family:"Playfair Display",Georgia,serif;font-size:4.4rem;line-height:.91;font-weight:500;letter-spacing:-.045em;margin:14px 0}
.location-card p{color:var(--muted);font-size:.84rem;line-height:1.7}
.map-art{border-radius:34px;overflow:hidden;min-height:480px;position:relative;background:linear-gradient(145deg,rgba(87,170,141,.2),rgba(19,50,43,.06)),repeating-linear-gradient(45deg,transparent 0 25px,rgba(19,50,43,.045) 26px 27px),var(--mint)}
.map-art svg{position:absolute;width:100%;height:100%;inset:0}
.map-pin{position:absolute;left:54%;top:48%;transform:translate(-50%,-50%);width:84px;height:84px;border-radius:50%;background:var(--ink);color:white;display:grid;place-items:center;box-shadow:0 14px 30px rgba(19,50,43,.2)}
.map-pin:before{content:"+";font-family:Georgia,serif;font-size:2.2rem;color:var(--teal-bright)}
.map-label{position:absolute;left:28px;bottom:28px;background:rgba(255,253,249,.92);backdrop-filter:blur(12px);border-radius:18px;padding:16px 18px;max-width:320px}
.map-label strong{display:block;font-family:"Playfair Display",Georgia,serif;font-size:1.2rem}
.map-label span{display:block;font-size:.68rem;color:var(--muted);margin-top:5px}
.final-cta{padding:110px 0 90px}
.cta-card{background:var(--teal);border-radius:42px;padding:65px;display:grid;grid-template-columns:1.2fr .8fr;gap:40px;align-items:end;position:relative;overflow:hidden}
.cta-card:after{content:"";position:absolute;width:400px;height:400px;border:1px solid rgba(255,255,255,.2);border-radius:50%;right:-130px;top:-170px}
.cta-card h2{font-family:"Playfair Display",Georgia,serif;font-size:clamp(3.3rem,5.7vw,6rem);line-height:.9;font-weight:500;letter-spacing:-.045em;margin:0;color:#07271e}
.cta-card p{font-size:.82rem;line-height:1.65;color:#17473b;max-width:430px}
.cta-actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:20px}
.footer{background:#0d2923;color:white;padding:60px 0 28px}
.footer-grid{display:grid;grid-template-columns:1.4fr .75fr .75fr .9fr;gap:44px}
.footer-logo{width:88px;height:88px;object-fit:cover;border-radius:50%;background:white}
.footer h4{font-size:.72rem;letter-spacing:.13em;text-transform:uppercase;margin:0 0 17px;color:var(--teal)}
.footer p,.footer a{font-size:.7rem;line-height:1.8;color:rgba(255,255,255,.62)}
.footer a:hover{color:white}
.footer-bottom{border-top:1px solid rgba(255,255,255,.1);margin-top:44px;padding-top:22px;display:flex;justify-content:space-between;gap:22px;font-size:.6rem;color:rgba(255,255,255,.38);line-height:1.6}
.float-wa{position:fixed;right:20px;bottom:20px;z-index:70;width:60px;height:60px;border-radius:50%;background:var(--teal-bright);color:#063226;display:grid;place-items:center;font-weight:900;box-shadow:0 16px 42px rgba(15,191,150,.35);transition:.25s}
.float-wa:hover{transform:scale(1.05) translateY(-2px)}
.reveal{opacity:0;transform:translateY(20px);transition:.7s cubic-bezier(.2,.7,.2,1)}
.reveal.show{opacity:1;transform:none}
.mobile-panel{display:none}
@media(max-width:1040px){
 .nav-links{display:none}
 .menu{display:flex}
 .nav-actions .btn-light{display:none}
 .hero-grid,.about-grid,.conversion-grid,.journal-grid,.location-grid,.cta-card{grid-template-columns:1fr}
 .hero{min-height:auto}
 .hero-grid{padding-top:54px}
 .hero-visual{min-height:620px}
 .section-head{grid-template-columns:1fr;gap:14px}
 .service-card:nth-child(n){grid-column:span 6}
 .conversion-grid{gap:32px}
 .footer-grid{grid-template-columns:1.3fr 1fr 1fr}
 .footer-grid>div:last-child{grid-column:1/-1}
 .mobile-panel{position:fixed;inset:124px 16px auto 16px;z-index:100;background:var(--paper);border:1px solid var(--line);border-radius:26px;padding:22px;box-shadow:var(--shadow)}
 .mobile-panel.open{display:grid;gap:8px}
 .mobile-panel a{padding:13px;border-bottom:1px solid var(--line);font-size:.82rem;font-weight:600}
 .mobile-panel a:last-child{border-bottom:0}
}
@media(max-width:700px){
 .wrap{width:min(100% - 26px,1240px)}
 .topline{height:auto;min-height:34px;padding:8px 0}
 .topline .wrap{justify-content:center}
 .topline span:nth-child(2){display:none}
 .nav-in{height:74px}
 .brand{min-width:auto}
 .logo{width:47px;height:47px}
 .brand-copy strong{font-size:.88rem}
 .brand-copy small{font-size:.49rem}
 .nav-actions .btn-dark{display:none}
 .hero-grid{padding:42px 0 65px;gap:30px}
 .hero h1{font-size:clamp(3.55rem,17vw,5.4rem)}
 .hero-lead{font-size:.9rem}
 .hero-meta{grid-template-columns:1fr;gap:8px;margin-top:35px}
 .hero-visual{min-height:500px}
 .photo-card{inset:0 0 42px 0;border-radius:30px}
 .orbit{width:105px;height:105px;right:-18px;top:-16px}
 .orbit:before{font-size:.45rem;width:80px}
 .mini-card{left:10px;width:205px;padding:17px}
 .section{padding:82px 0}
 .section-head{margin-bottom:34px}
 .section-head h2{font-size:3.2rem}
 .about-panel{padding:32px;border-radius:28px;min-height:auto}
 .about-panel h3{font-size:2.45rem}
 .about-points{grid-template-columns:1fr}
 .pets-panel{min-height:390px;border-radius:28px}
 .service-grid{gap:10px}
 .service-card:nth-child(n){grid-column:span 12;min-height:220px;border-radius:22px;padding:24px}
 .service-card h3{font-size:1.85rem}
 .conversion{padding:76px 0}
 .conversion h2{font-size:3.35rem}
 .live-actions{grid-template-columns:1fr}
 .journal-feature{padding:30px;min-height:390px}
 .journal-feature .big{font-size:3rem}
 .small-story{padding:26px}
 .location-card{padding:30px;min-height:auto}
 .location-card h2{font-size:3.2rem}
 .map-art{min-height:390px}
 .cta-card{padding:38px 28px;border-radius:30px}
 .cta-card h2{font-size:3.5rem}
 .footer-grid{grid-template-columns:1fr 1fr;gap:30px}
 .footer-grid>div:first-child,.footer-grid>div:last-child{grid-column:1/-1}
 .footer-bottom{flex-direction:column}
 .float-wa{width:54px;height:54px;right:14px;bottom:14px}
}
@media(prefers-reduced-motion:reduce){
 *{scroll-behavior:auto!important;animation:none!important;transition:none!important}
 .reveal{opacity:1;transform:none}
}
</style>
</head>
